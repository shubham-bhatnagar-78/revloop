[project]
name = "revloop"
version = "0.1.0"
description = "Keep GTM context current for teams and AI agents, and measure whether agent actions moved pipeline."
readme = "README.md"
authors = [{ name = "Shubham Bhatnagar" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
revloop = "revloop.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.3.0",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
